services:
  postgres:
    image: postgres:16
    container_name: tracelab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tracelab_db
      POSTGRES_USER: tracelab_user
      POSTGRES_PASSWORD: tracelab_password
    ports:
      - "5432:5432"
    volumes:
      - tracelab_postgres_data:/var/lib/postgresql/data

volumes:
  tracelab_postgres_data: